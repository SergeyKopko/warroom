/* The entry point checks holdings before asking for anything. A wallet that already
   owns a Commander goes straight into the game; the mint dialog is only for wallets
   that have nothing yet. */
function enterGame(){
  if(hasCommander()){
    closeModal(); S.screen='play'; window.scrollTo(0,0); render();
    toast('Welcome back',`Playing as Commander #${S.cmd.id} · ${rank().name}. ${S.owned.length>1?`${S.owned.length} commanders on this wallet.`:''}`);
    return;
  }
  if(S.connected){ mintQty=1; openModal('mint'); return; }
  openModal('connect');
}
function stamp(hit,dmg){
  const d=document.createElement('div'); d.className='stamp-l';
  d.innerHTML=`<div class="stamp" style="color:${hit?'var(--amber)':'var(--faint)'}">
    <div class="big">${hit?'Target hit':'Intercepted'}</div>
    <div class="sm">${hit?`+${fmt(dmg)} damage`:'No damage'}</div></div>`;
  el('stamps').appendChild(d);
  // the element leaves when its own last animation ends — one source of truth
  d.querySelector('.stamp').addEventListener('animationend', e=>{
    if(e.animationName==='resOut') d.remove();
  });
}
function doLaunch(extra){
  const c=S.cmd, m=missile();
  if(!extra && now()<c.lastLaunch+DEMO.cooldownSec*1000) return;
  if(extra){
    if(c.extraToday>=3){ toast('Daily limit','Three extra launches a day, and no more.'); return; }
    if(S.wallet_war<10000){ toast('Not enough WAR','An extra launch costs 10,000 WAR.'); return; }
    S.wallet_war-=10000; c.spent+=10000; c.burned+=5000; c.extraToday++; S.totals.burned+=5000;
  } else c.lastLaunch=now();
  c.activeThisRound=true;
  const hit=Math.random()>INTERCEPT;
  c.launches++; S.totals.launches++;
  if(hit){ c.hits++; c.damage+=m.dmg; S.enemy.hp=Math.max(0,S.enemy.hp-m.dmg); S.enemy.damageToday+=m.dmg;
    if(S.enemy.hp<=0) resetEnemy(); }
  launchArc(true,hit,m.lvl); stamp(hit,m.dmg);
  push(`<b>You</b> launched <b>Level ${m.lvl}</b>${extra?' (paid launch)':''} — ${hit?`hit, <b>+${fmt(m.dmg)} damage</b>`:'intercepted'}`,true);
  render();
}
function doUpgrade(lvl){
  const c=S.cmd,m=MISSILES[lvl-1];
  if(c.lvl+1!==m.lvl||c.hits<m.hits||S.wallet_war<m.cost) return;
  c.lvl=m.lvl; S.wallet_war-=m.cost; c.spent+=m.cost; c.burned+=m.cost*.5; S.totals.burned+=m.cost*.5;
  push(`<b>You</b> upgraded to <b>Level ${m.lvl}</b> — <b>${fmt(m.cost*.5)} WAR</b> burned`,true);
  toast('Missile upgraded',`Level ${m.lvl}. Every hit now does ${fmt(m.dmg)} damage.`); render();
}
function doPromote(){
  const c=S.cmd,r=RANKS[c.rank+1];
  if(!r||c.hits<reqHits(r)||ageDays()<r.days||S.wallet_war<r.cost) return;
  if(r.seats&&S.seats[r.id]>=r.seats) return;
  c.rank=r.id; S.wallet_war-=r.cost; c.spent+=r.cost; c.burned+=r.cost*.5; S.totals.burned+=r.cost*.5;
  c.bought=false;
  if(r.seats) S.seats[r.id]++;
  push(`<b>You</b> were promoted to <b>${r.name}</b> — rewards now <b>${r.mult.toFixed(1)}x</b>`,true);
  toast('Promoted',`${r.name}. Your rank gives you ${r.mult.toFixed(1)}x rewards.`); render();
}
function buyRank(){
  const c=S.cmd,r=RANKS[c.rank+1];
  if(!r||!r.buy||S.wallet_war<r.buy) return;
  if(r.seats&&S.seats[r.id]>=r.seats) return;
  c.rank=r.id; S.wallet_war-=r.buy; c.spent+=r.buy; c.burned+=r.buy*.5; S.totals.burned+=r.buy*.5;
  c.bought=true;
  if(r.seats) S.seats[r.id]++;
  push(`<b>You</b> bought the rank of <b>${r.name}</b> — <b>${fmt(r.buy*.5)} WAR</b> burned`,true);
  toast('Rank bought',`${r.name}, straight away. Your file is marked and the next rung costs 50% more hits.`);
  render();
}
function doChallenge(i){
  const g=GENERALS[i], c=S.cmd, dep=DEPOSIT[4];
  if(c.rank!==3||S.challenge||S.wallet_war<dep||g.shield) return;
  S.wallet_war-=dep;
  S.challenge={ target:g, idx:i, dep, claim:false, endsAt:now()+60000 };
  push(`<b>You</b> challenged General <b>${g.cs}</b> — <b>${fmt(dep)} WAR</b> deposited`,true);
  toast('Challenge sent',`${g.cs} has ${DEFEND_HOURS} hours to defend the seat.`); render();
}
function claimSeat(i){
  const c=S.cmd, dep=DEPOSIT[4];
  if(!claimable()) return;
  S.wallet_war-=dep;
  S.challenge={ target:{cs:'the vacant chair'}, idx:i, dep, claim:true, endsAt:now()+60000 };
  push(`<b>You</b> opened a claim on the vacant General chair — <b>${fmt(dep)} WAR</b> deposited`,true);
  toast('Claim opened','An empty chair still has to be won in the open. Any Colonel can contest it.');
  render();
}
function resolveChallenge(){
  const ch=S.challenge; if(!ch) return; const c=S.cmd, dep=ch.dep;
  const holds = ch.claim ? Math.random()<0.3 : Math.random()<0.45;
  if(holds){
    // defended, or the claim was contested by another Colonel
    c.burned+=dep*.495; S.totals.burned+=dep*.495; S.wallet_war+=dep*.5;
    if(!ch.claim) GENERALS[ch.idx].shield=PROTECT_DAYS;
    push(ch.claim
      ? `Another Colonel matched your claim — <b>${fmt(dep*.5)} WAR</b> burned, the chair stays empty`
      : `<b>${ch.target.cs}</b> defended the seat — <b>${fmt(dep*.5)} WAR</b> of your deposit burned`, true);
    toast(ch.claim?'Claim contested':'Seat defended',
      `${fmt(dep*.5)} WAR burned, ${fmt(dep*.5)} returned.${ch.claim?'':` That seat is protected for ${PROTECT_DAYS} days.`}`);
  } else {
    S.wallet_war+=dep;                      // deposit returns to the winner
    if(!ch.claim){                   // the ousted General keeps 30%, the rest burns
      S.wallet_war-=dep; c.burned+=dep*.695; S.totals.burned+=dep*.695;
      push(`<b>${ch.target.cs}</b> stayed silent — <b>you are a General</b> · ${fmt(dep*.3)} WAR severance, ${fmt(dep*.695)} burned, ${fmt(dep*CLERK_FEE)} to the settler`,true);
    } else push(`No one contested the chair — <b>you are a General</b>`,true);
    S.seats[3]--; c.rank=4; c.bought=false;
    GENERALS[ch.idx]={ id:c.id, cs:'YOU', dmg:c.damage, since:0, shield:PROTECT_DAYS, bought:false };
    toast('You are a General',`One of ten seats. Rewards now 4.0x, protected for ${PROTECT_DAYS} days.`);
    setTimeout(()=>{ if(S.cmd&&S.cmd.rank===4&&!S.underAttack){
      S.underAttack={ from:1000+Math.floor(Math.random()*900), endsAt:now()+90000 };
      toast('Your position is under attack',`Commander #${S.underAttack.from} challenged your seat. ${DEFEND_HOURS} hours to defend.`);
      push(`<b>Commander #${S.underAttack.from}</b> challenged <b>your</b> General seat`,true); render(); } }, 22000);
  }
  S.challenge=null; render();
}
function defendSeat(){
  const a=S.underAttack, c=S.cmd, dep=DEPOSIT[4];
  if(!a||S.wallet_war<dep) return;
  const idx=GENERALS.findIndex(g=>g.cs==='YOU');
  if(idx>=0) GENERALS[idx].shield=PROTECT_DAYS;
  push(`<b>You</b> defended your seat — the challenger's <b>${fmt(dep*.495)} WAR</b> burned`,true);
  toast('Seat held',`Your deposit comes straight back. Nobody can challenge you for ${PROTECT_DAYS} days.`);
  S.totals.burned+=dep*.495; S.underAttack=null; render();
}
function concedeSeat(){
  const a=S.underAttack, c=S.cmd, dep=DEPOSIT[4];
  if(!a) return;
  S.wallet_war+=dep*.3; c.rank=3; S.seats[3]++;
  const idx=GENERALS.findIndex(g=>g.cs==='YOU');
  if(idx>=0) GENERALS[idx]={ id:a.from, cs:'NEW HOLDER', dmg:Math.round(120000+Math.random()*400000), since:0, shield:PROTECT_DAYS };
  push(`<b>You</b> let the seat go — <b>${fmt(dep*.3)} WAR</b> severance, back to Colonel`,true);
  toast('Seat lost',`You are a Colonel again and kept ${fmt(dep*.3)} WAR of the challenger's deposit.`);
  S.underAttack=null; render();
}
function claim(){
  const c=S.cmd, amount=pendingOf(c);
  if(!amount){ toast('Nothing to claim',`Rewards are credited when a round closes, every ${ROUND_HOURS} hours.`); return; }
  c.claimed=c.accrued;
  push(`<b>You</b> claimed <b>${pltr(amount)}</b> for Commander <b>#${c.id}</b>`,true);
  toast('Claimed',`${pltr(amount)} withdrawn for Commander #${c.id}.`);
  render();
}
function claimAll(){
  const amount=walletPending();
  if(!amount){ toast('Nothing to claim','None of your commanders has anything credited yet.'); return; }
  const n=S.owned.filter(c=>pendingOf(c)>0).length;
  S.owned.forEach(c=>c.claimed=c.accrued);
  push(`<b>You</b> claimed <b>${pltr(amount)}</b> across <b>${n}</b> commanders in one transaction`,true);
  toast('Claimed everything',`${pltr(amount)} withdrawn across ${n} commander${n>1?'s':''}.`);
  render();
}
let nextId = 4821;
function newCommander(){
  return { id:nextId++, rank:0, lvl:1, hits:0, launches:0, damage:0, bought:false,
    spent:100000, burned:50000, minted:now(), lastLaunch:0, extraToday:0, activeThisRound:false,
    accrued:0, claimed:0, tips:0, rounds:[] };
}
function mint(){
  const left = SUPPLY.cap-SUPPLY.minted;
  if(left<=0){ toast('Sold out','All 1,200 Commanders are minted. The only way in now is the secondary market.'); return; }
  const first = !S.owned.length;
  const qty = Math.min(mintQty, left);
  const due = (first ? qty-1 : qty) * 100000;
  if(S.wallet_war < due){ toast('Not enough WAR',`Minting ${qty} costs ${fmt(qty*100000)} WAR.`); return; }

  S.wallet_war -= due;
  const made=[];
  for(let i=0;i<qty;i++){
    SUPPLY.minted++;
    const c = newCommander();
    if(first && i===0) c.minted = now()-4.2*864e5;   // the demo account has some history
    S.owned.push(c); made.push(c.id);
  }
  setActive(S.owned.length-qty);        // land on the first of the batch
  S.totals.burned += qty*50000; S.totals.players += qty;
  S.connected=true; if(first) S.screen='play';
  mintQty=1; closeModal();

  push(qty===1
    ? `<b>You</b> minted Commander <b>#${made[0]}</b> — <b>50,000 WAR</b> burned`
    : `<b>You</b> minted <b>${qty}</b> Commanders (#${made[0]}–#${made[made.length-1]}) — <b>${fmt(qty*50000)} WAR</b> burned`, true);
  toast(qty===1?`Commander #${made[0]} minted`:`${qty} Commanders minted`,
    first && qty===1 ? 'Recruit, Missile Level 1. Your first launch is ready now.'
    : `This wallet now holds ${S.owned.length}. Each one levels, ranks and earns on its own — and each needs its own launch every round.`);
  render();
}

/* ============================================================
   ROUTER
   ============================================================ */
const SCREENS={ play:screenPlay, upgrade:screenUpgrade, rank:screenRank, rewards:screenRewards, docs:screenDocs };
function docShell(body){
  return `<div class="topbar docbar"><button class="brand" data-act="goto" data-v="landing" title="Back to the front page"><span class="dot"></span><b>WARROOM</b></button>
    <div style="display:flex;gap:10px;align-items:center;padding:11px 0">
      <button class="btn btn-sm" data-act="goto" data-v="landing">Back</button>
      ${headLinks()}
      <button class="btn btn-sm btn-amber" data-act="connect">${hasCommander()?'Enter Warroom':S.connected?'Mint a Commander':'Connect wallet'}</button></div></div>${body}`;
}
function render(){
  el('app').innerHTML = S.screen==='landing' ? landing()
    : (S.cmd ? shell(SCREENS[S.screen]()) : docShell(SCREENS[S.screen]()));
  const f=el('feed'); if(f) f.innerHTML=S.feed.map(row).join('');
  drawModal();
}
document.addEventListener('click',e=>{
  const b=e.target.closest('[data-act]'); if(!b) return;
  const a=b.dataset.act,v=b.dataset.v;
  if(a==='backdrop'&&e.target!==b) return;
  switch(a){
    case 'goto':
      if(v!=='landing' && v!=='docs' && !hasCommander()){ enterGame(); break; }
      S.screen=v; window.scrollTo(0,0); render(); break;
    case 'connect': enterGame(); break;
    case 'copy': navigator.clipboard?.writeText(v); toast('Copied',`${v.slice(0,10)}… is on your clipboard.`); break;
    case 'explorer': window.open(`${CHAIN.explorer}/address/${v}`,'_blank'); break;
    case 'getwar': LINKS.swap ? window.open(LINKS.swap,'_blank')
      : toast('Pool not open yet',`WAR trades against PLTR once the pool is seeded on ${CHAIN.name}. The token address appears here the moment it does.`); break;
    case 'x': window.open(LINKS.x,'_blank'); break;
    case 'howto': openModal('howto'); break;
    case 'wallet': S.connected=true; S.wrongNet=true; openModal('network'); render(); break;
    case 'switch': S.wrongNet=false; toast('Network switched',`Connected to ${CHAIN.name} (chain ${CHAIN.id}).`); enterGame(); break;
    case 'mint': mint(); break;
    case 'qty': {
      const left=SUPPLY.cap-SUPPLY.minted, first=!S.owned.length;
      const maxQty=Math.min(left,25,first?25:Math.floor(S.wallet_war/100000)||1);
      if(v==='+') mintQty=Math.min(maxQty,mintQty+1);
      else if(v==='-') mintQty=Math.max(1,mintQty-1);
      else if(v==='max') mintQty=maxQty;
      else mintQty=Math.min(maxQty,+v);
      syncMintQty(maxQty,first) || drawModal();
      break;
    }
    case 'launch': doLaunch(false); break;
    case 'extra': doLaunch(true); break;
    case 'upgrade': doUpgrade(+v); break;
    case 'promote': doPromote(); break;
    case 'buyrank': buyRank(); break;
    case 'claim-seat': claimSeat(+v); break;
    case 'defend': defendSeat(); break;
    case 'concede': concedeSeat(); break;
    case 'scroll-seats': el('seats-major')?.scrollIntoView({behavior:'smooth',block:'center'}); break;
    case 'challenge': doChallenge(+v); break;
    case 'resolve': resolveChallenge(); break;
    case 'claim': claim(); break;
    case 'claimall': claimAll(); break;
    case 'roster': openModal('roster'); break;
    case 'switch-cmd': setActive(+v); closeModal(); toast('Now playing as',`Commander #${S.cmd.id} — ${rank().name}, Missile Level ${S.cmd.lvl}.`); render(); break;
    case 'mint-another': mintQty=1; openModal('mint'); break;
    case 'closeround': closeRound(true); break;
    case 'scroll-gen': el('generals')?.scrollIntoView({behavior:'smooth',block:'center'}); break;
    case 'toast-close': dismissToast(b.closest('.toast')); break;
    case 'close': case 'backdrop': closeModal(); break;
  }
});
document.addEventListener('click',e=>{
  const a=e.target.closest('.toc a'); if(!a) return;
  e.preventDefault();
  document.getElementById(a.getAttribute('href').slice(1))?.scrollIntoView({behavior:'smooth',block:'start'});
});
document.addEventListener('keydown',e=>{ if(e.key==='Escape'&&modal&&modal!=='network') closeModal(); });

let reloading=false;
setInterval(()=>{
  const set=(k,v)=>document.querySelectorAll(`[data-tick="${k}"]`).forEach(n=>n.textContent=v);
  const P=S.pool;
  if(P.status==='open'){
    const left=P.endsAt-now();
    set('round','Closes in '+clock(left)); set('round2',clock(left)); set('round3',clock(left));
    if(left<=0 && S.cmd){
      P.status='closable'; P.grabAt=now()+12000;   // demo: a bot takes the fee if nobody moves
      toast('Round ready to close',`Anyone can trigger it and keep ${(CLERK_FEE*100).toFixed(1)}% of the pool. First one there gets it.`);
      render();
    }
  } else if(P.status==='closable'){
    set('round','Ready to close'); set('round2','ready'); set('round3','ready');
    if(now()>=P.grabAt) closeRound(false);
  } else { set('round','Settling'); set('round3','settling'); }
  const c=S.cmd; if(!c) return;
  const cd=c.lastLaunch+DEMO.cooldownSec*1000-now();
  if(cd>0){ reloading=true; set('cd',`next launch in ${clock(cd)}`); }
  else if(reloading){ reloading=false; toast('Launch ready','Your silo has reloaded.'); render(); }
  if(S.challenge){
    set('chal',clock(Math.max(0,S.challenge.endsAt-now()))+(S.challenge.claim?' until the claim settles':' left to defend'));
    if(now()>=S.challenge.endsAt) resolveChallenge();
  }
  if(S.underAttack){
    set('def',clock(Math.max(0,S.underAttack.endsAt-now()))+' remaining');
    if(now()>=S.underAttack.endsAt) concedeSeat();
  }
},1000);

setInterval(()=>{
  if(document.hidden) return;
  const hit=Math.random()>INTERCEPT;
  launchArc(false,hit,1+Math.floor(Math.random()*4));
  if(hit){ const d=Math.floor(Math.random()*1400); S.enemy.hp=Math.max(0,S.enemy.hp-d); S.enemy.damageToday+=d*30;
    if(S.enemy.hp<=0){ resetEnemy(); render(); } }
  if(S.pool.status==='open') S.pool.chest += 0.004+Math.random()*0.012;
  const cw=document.querySelector('[data-live="chest"]'); if(cw) cw.textContent=pltr(roundPool());
  if(Math.random()<0.5) push(AMBIENT[Math.floor(Math.random()*AMBIENT.length)]());
  const f=document.querySelector('.hp-fill'); if(f) f.style.transform='scaleX('+(S.enemy.hp/ENEMY_MAX).toFixed(4)+')';
},2400);


for(let i=0;i<7;i++) push(AMBIENT[Math.floor(Math.random()*AMBIENT.length)]());
render(); loop();
setTimeout(()=>{ launchArc(false,true,3); launchArc(false,false,2); },600);

</script>
