<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>WARROOM — Launch. Burn WAR. Earn PLTR.</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --void:#0B0D0F; --board:#0E1216; --panel:#12161A; --panel2:#171C21;
  --line:#242A30; --line2:#333B42;
  --ink:#E8ECEF; --dim:#94A0A9; --faint:#5A646D;
  --fed:#2E9BFF; --fed-deep:#0A2E4E;
  --rep:#F04A2E; --rep-deep:#4E1509;
  --amber:#FFB020; --amber-deep:#3A2708;
  --disp:'Chakra Petch',Impact,'Arial Narrow',sans-serif;
  --mono:'IBM Plex Mono',ui-monospace,Menlo,Consolas,monospace;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{
  background:var(--void); color:var(--ink);
  font-family:var(--disp); font-size:15px; line-height:1.45;
  -webkit-font-smoothing:antialiased;
  overflow-x:hidden;
}
body::before{
  content:''; position:fixed; inset:0; pointer-events:none; z-index:100;
  background:radial-gradient(ellipse at 50% 40%, transparent 45%, rgba(0,0,0,.55) 100%);
}
::selection{background:var(--amber);color:#000}
button{font-family:inherit;color:inherit;background:none;border:none;cursor:pointer}
button:disabled{cursor:not-allowed}
a{color:inherit;text-decoration:none}
:focus-visible{outline:2px solid var(--amber);outline-offset:2px}

/* ---------- primitives ---------- */
.mono{font-family:var(--mono)}
.eyebrow{
  font-family:var(--mono); font-size:10px; letter-spacing:.22em;
  text-transform:uppercase; color:var(--faint);
}
.num{font-family:var(--mono);font-variant-numeric:tabular-nums;font-feature-settings:"tnum"}
.fed{color:var(--fed)} .rep{color:var(--rep)} .amb{color:var(--amber)} .dim{color:var(--dim)}

.panel{background:var(--panel);border:1px solid var(--line);position:relative}
.panel-h{
  display:flex;align-items:center;justify-content:space-between;gap:12px;
  padding:9px 14px;border-bottom:1px solid var(--line);background:var(--panel2);
}
.panel-h h3{font-size:12px;letter-spacing:.18em;text-transform:uppercase;font-weight:600}
.panel-b{padding:16px}

.btn{
  font-family:var(--disp);font-weight:600;font-size:13px;letter-spacing:.14em;
  text-transform:uppercase;padding:11px 20px;border:1px solid var(--line2);
  background:var(--panel2);color:var(--ink);transition:.14s;position:relative;
}
.btn:hover:not(:disabled){background:var(--line);border-color:var(--dim)}
.btn:disabled{color:var(--faint);border-color:var(--line);background:transparent}
.btn-fed{background:var(--fed-deep);border-color:var(--fed);color:#BFE2FF}
.btn-fed:hover:not(:disabled){background:var(--fed);color:#00131F;border-color:var(--fed)}
.btn-amber{background:var(--amber-deep);border-color:var(--amber);color:var(--amber)}
.btn-amber:hover:not(:disabled){background:var(--amber);color:#180F00}
.btn-lg{padding:15px 28px;font-size:15px;letter-spacing:.2em}
.btn-sm{padding:7px 12px;font-size:11px;letter-spacing:.1em}
.btn-block{width:100%;display:block;text-align:center}

.tag{
  font-family:var(--mono);font-size:10px;letter-spacing:.16em;text-transform:uppercase;
  padding:3px 7px;border:1px solid var(--line2);color:var(--dim);display:inline-block;
}
.tag-fed{border-color:var(--fed);color:var(--fed);background:rgba(46,155,255,.08)}
.tag-rep{border-color:var(--rep);color:var(--rep);background:rgba(240,74,46,.08)}
.tag-amb{border-color:var(--amber);color:var(--amber);background:rgba(255,176,32,.08)}
.tag-off{border-color:var(--line);color:var(--faint)}

/* ---------- app shell ---------- */
#app{min-height:100vh;display:flex;flex-direction:column}
.topbar{
  display:flex;align-items:stretch;border-bottom:1px solid var(--line);
  background:var(--panel);position:sticky;top:0;z-index:40;
}
.brand{
  display:flex;align-items:center;gap:10px;padding:0 18px;border-right:1px solid var(--line);
}
button.brand{cursor:pointer;background:none;border:0;font-family:inherit;color:inherit}
.brand:hover b{color:var(--amber)}
.brand b{transition:color .14s}
.landbrand{margin-left:0;padding-left:0;border-right:0}
.brand b{
  font-size:19px;font-weight:700;letter-spacing:.26em;
}
.brand .dot{width:7px;height:7px;background:var(--rep);animation:pulse 2s infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.2}}
.nav{display:flex;flex:1;overflow-x:auto;scrollbar-width:none}
.nav::-webkit-scrollbar{display:none}
.nav button{
  padding:16px 16px;font-size:11.5px;letter-spacing:.16em;text-transform:uppercase;
  color:var(--dim);border-bottom:2px solid transparent;white-space:nowrap;transition:.14s;
}
.nav button:hover{color:var(--ink);background:var(--panel2)}
.nav button.on{color:var(--ink);border-bottom-color:var(--amber);background:var(--panel2)}
.nav button .badge{
  display:inline-block;margin-left:6px;background:var(--rep);color:#fff;font-family:var(--mono);
  font-size:9px;padding:1px 4px;vertical-align:middle;
}
.topright{display:flex;align-items:center;gap:14px;padding:0 16px;border-left:1px solid var(--line)}
.season-clock{text-align:right;line-height:1.15}
.season-clock .t{font-family:var(--mono);font-size:15px;letter-spacing:.04em;color:var(--amber)}
.wallet{
  display:flex;align-items:center;gap:8px;border:1px solid var(--line2);padding:7px 11px;
  font-family:var(--mono);font-size:11.5px;
}
.wallet .av{width:16px;height:16px;background:var(--fed)}

.page{flex:1;padding:22px;max-width:1560px;width:100%;margin:0 auto}
.page-head{display:flex;align-items:flex-end;justify-content:space-between;gap:20px;margin-bottom:18px;flex-wrap:wrap}
.page-head h1{font-size:30px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;line-height:1}
.page-head p{color:var(--dim);font-size:13px;max-width:62ch;margin-top:7px}

/* ---------- resilience bar ---------- */
.resil{display:grid;grid-template-columns:1fr auto 1fr;gap:0;align-items:center;border:1px solid var(--line);background:var(--panel)}
.resil .side{padding:12px 16px}
.resil .side.r{text-align:right}
.resil .lbl{display:flex;align-items:baseline;gap:9px;margin-bottom:7px}
.resil .side.r .lbl{justify-content:flex-end}
.resil .lbl b{font-size:13px;letter-spacing:.18em;text-transform:uppercase}
.resil .lbl span{font-family:var(--mono);font-size:11px;color:var(--dim)}
.rtrack{height:14px;background:#0E1216;border:1px solid var(--line);position:relative;overflow:hidden}
.rfill{position:absolute;top:0;bottom:0;transition:width .8s cubic-bezier(.2,.8,.3,1)}
.rfill.f{right:0;background:linear-gradient(90deg,var(--fed-deep),var(--fed))}
.rfill.r{left:0;background:linear-gradient(90deg,var(--rep),var(--rep-deep))}
.rtrack::after{
  content:'';position:absolute;inset:0;
  background:repeating-linear-gradient(90deg,transparent 0 11px,rgba(0,0,0,.45) 11px 12px);
}
.resil .mid{
  padding:10px 14px;border-left:1px solid var(--line);border-right:1px solid var(--line);
  text-align:center;background:var(--panel2);align-self:stretch;display:flex;
  flex-direction:column;justify-content:center;min-width:96px;
}
.resil .mid .v{font-family:var(--mono);font-size:11px;color:var(--faint);letter-spacing:.1em}
.resil .mid .k{font-size:16px;font-weight:700;letter-spacing:.14em}

/* ---------- plot board ---------- */
.warlayout{display:grid;grid-template-columns:1fr 340px;gap:14px;margin-top:14px;align-items:start}
.plotwrap{position:relative;background:var(--board);border:1px solid var(--line);overflow:hidden}
#plot{display:block;width:100%;height:auto}
.plot-ov{position:absolute;inset:0;pointer-events:none;
  background:repeating-linear-gradient(0deg,rgba(0,0,0,.22) 0 1px,transparent 1px 3px)}
.plot-corner{position:absolute;font-family:var(--mono);font-size:9.5px;letter-spacing:.18em;color:var(--faint);pointer-events:none}
.pc-tl{top:10px;left:12px} .pc-tr{top:10px;right:12px;text-align:right} .pc-bl{bottom:10px;left:12px}
.plot-legend{position:absolute;bottom:10px;right:12px;display:flex;gap:14px;font-family:var(--mono);font-size:9.5px;color:var(--faint)}
.plot-legend i{display:inline-block;width:7px;height:7px;margin-right:5px;vertical-align:1px}

/* ---------- dispatch feed ---------- */
.feed{max-height:520px;overflow-y:auto;scrollbar-width:thin}
.feed::-webkit-scrollbar{width:5px}
.feed::-webkit-scrollbar-thumb{background:var(--line2)}
.fitem{padding:9px 14px;border-bottom:1px solid var(--line);display:flex;gap:10px;font-size:12.5px;animation:slidein .35s ease}
@keyframes slidein{from{opacity:0;transform:translateX(10px)}to{opacity:1;transform:none}}
.fitem .ts{font-family:var(--mono);font-size:10px;color:var(--faint);padding-top:2px;min-width:38px}
.fitem .bd{flex:1;color:var(--dim);line-height:1.35}
.fitem .bd b{color:var(--ink);font-weight:600}
.fitem.me{background:rgba(255,176,32,.05);border-left:2px solid var(--amber)}

/* ---------- action deck ---------- */
.deck{display:grid;grid-template-columns:repeat(4,minmax(0,1fr)) auto;gap:1px;background:var(--line);border:1px solid var(--line);margin-top:14px}
.deck .cell{background:var(--panel);padding:13px 16px}
.deck .cell .k{font-family:var(--mono);font-size:9.5px;letter-spacing:.2em;color:var(--faint);text-transform:uppercase}
.deck .cell .v{font-size:19px;font-weight:600;letter-spacing:.06em;margin-top:3px;white-space:nowrap}
.deck .cell .sub{font-family:var(--mono);font-size:10.5px;color:var(--dim);margin-top:2px}
.deck .fire{background:var(--panel);padding:10px;display:flex;gap:10px;align-items:center}

.launch{
  font-family:var(--disp);font-weight:700;font-size:17px;letter-spacing:.24em;text-transform:uppercase;
  padding:16px 34px;border:1px solid var(--rep);color:#FFD9CF;
  background:linear-gradient(180deg,rgba(240,74,46,.28),rgba(240,74,46,.1));
  position:relative;transition:.15s;white-space:nowrap;
}
.launch:hover:not(:disabled){background:var(--rep);color:#1A0500;box-shadow:0 0 26px rgba(240,74,46,.4)}
.launch:disabled{border-color:var(--line);color:var(--faint);background:transparent;box-shadow:none}
.launch .cd{display:block;font-family:var(--mono);font-size:11px;letter-spacing:.1em;margin-top:3px;color:var(--dim)}

/* ---------- stamp overlay ---------- */
.stamp-l{position:fixed;inset:0;z-index:90;display:grid;place-items:center;pointer-events:none}
.stamp{
  border:4px solid currentColor;padding:16px 34px;text-align:center;
  transform:rotate(-7deg) scale(1.35);opacity:0;animation:stampIn .16s ease-out forwards, stampOut .5s 1.1s forwards;
  background:rgba(6,9,11,.86);
}
.stamp .big{font-size:44px;font-weight:700;letter-spacing:.16em;line-height:1}
.stamp .sm{font-family:var(--mono);font-size:13px;letter-spacing:.22em;margin-top:6px}
@keyframes stampIn{to{opacity:1;transform:rotate(-7deg) scale(1)}}
@keyframes stampOut{to{opacity:0}}

/* ---------- grids & cards ---------- */
.grid2{display:grid;grid-template-columns:repeat(2,1fr);gap:14px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}
.grid4{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}
.statgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:1px;background:var(--line)}
.stat{background:var(--panel);padding:14px 16px}
.stat .k{font-family:var(--mono);font-size:9.5px;letter-spacing:.18em;color:var(--faint);text-transform:uppercase}
.stat .v{font-size:23px;font-weight:600;margin-top:4px;letter-spacing:.02em}
.stat .v small{font-size:12px;color:var(--dim);font-weight:400;margin-left:4px}

.bar{height:6px;background:#0E1216;border:1px solid var(--line);position:relative;overflow:hidden}
.bar i{position:absolute;left:0;top:0;bottom:0;background:var(--amber);transition:width .5s}
.bar.b-fed i{background:var(--fed)}

/* missile card */
.mcard{border:1px solid var(--line);background:var(--panel);padding:0;position:relative;transition:.15s}
.mcard.owned{border-color:var(--fed)}
.mcard.locked{opacity:.62}
.mcard .top{padding:14px 16px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:flex-start;gap:10px}
.mcard .tier{font-family:var(--mono);font-size:10px;letter-spacing:.2em;color:var(--faint)}
.mcard .nm{font-size:22px;font-weight:700;letter-spacing:.1em;line-height:1.1;margin-top:2px}
.mcard .specs{display:grid;grid-template-columns:1fr 1fr;gap:1px;background:var(--line)}
.mcard .spec{background:var(--panel);padding:11px 16px}
.mcard .spec .k{font-family:var(--mono);font-size:9px;letter-spacing:.16em;color:var(--faint);text-transform:uppercase}
.mcard .spec .v{font-size:17px;font-weight:600;margin-top:2px}
.mcard .foot{padding:13px 16px;border-top:1px solid var(--line)}
.silo{height:52px;display:flex;align-items:flex-end;gap:3px;padding:0 16px 12px}
.silo i{flex:1;background:var(--line2);transform-origin:bottom}

/* rank ladder */
.ladder{display:flex;flex-direction:column;gap:1px;background:var(--line);border:1px solid var(--line)}
.rung{background:var(--panel);display:grid;grid-template-columns:56px 1fr 200px 190px;gap:16px;align-items:center;padding:14px 16px;transition:.15s}
.rung.cur{background:var(--panel2);box-shadow:inset 3px 0 0 var(--amber)}
.rung.done{opacity:.55}
.rung .chev{font-family:var(--mono);font-size:11px;color:var(--faint);text-align:center;line-height:1.2}
.rung .chev b{display:block;font-size:17px;color:var(--dim)}
.rung h4{font-size:19px;font-weight:700;letter-spacing:.14em;text-transform:uppercase}
.rung .req{font-family:var(--mono);font-size:11px;color:var(--dim);margin-top:3px}
.rung .mult{font-size:20px;font-weight:600;text-align:right}
.rung .mult span{font-family:var(--mono);font-size:10px;color:var(--faint);display:block;letter-spacing:.16em}
.seats{display:flex;gap:2px;flex-wrap:wrap;margin-top:6px}
.seats i{width:6px;height:11px;background:var(--line2)}
.seats i.taken{background:var(--amber)}
.seats i.free{background:var(--line2)}

/* table */
table{width:100%;border-collapse:collapse;font-size:13px}
th{
  font-family:var(--mono);font-size:9.5px;letter-spacing:.18em;text-transform:uppercase;color:var(--faint);
  text-align:left;padding:9px 14px;border-bottom:1px solid var(--line);font-weight:500;
}
td{padding:11px 14px;border-bottom:1px solid var(--line)}
tbody tr:hover{background:var(--panel2)}
tbody tr.me{background:rgba(255,176,32,.07)}
tbody tr.me td:first-child{box-shadow:inset 3px 0 0 var(--amber)}
.rk{font-family:var(--mono);color:var(--faint);width:44px}
.rk.top{color:var(--amber)}
.cmdr{display:flex;align-items:center;gap:9px}
.cmdr .av{width:22px;height:22px;flex:none}
.tabs{display:flex;gap:1px;background:var(--line);border:1px solid var(--line);margin-bottom:14px;overflow-x:auto}
.tabs button{background:var(--panel);padding:10px 16px;font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:var(--dim);white-space:nowrap}
.tabs button.on{background:var(--panel2);color:var(--amber)}

/* modal */
.modal-l{position:fixed;inset:0;z-index:80;background:rgba(4,7,9,.86);display:grid;place-items:center;padding:20px;animation:fade .2s}
@keyframes fade{from{opacity:0}to{opacity:1}}
.modal{width:100%;max-width:560px;border:1px solid var(--line2);background:var(--panel);animation:up .25s ease}
@keyframes up{from{transform:translateY(14px);opacity:0}to{transform:none;opacity:1}}
.modal-h{padding:16px 20px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center}
.modal-h h3{font-size:17px;letter-spacing:.16em;text-transform:uppercase;font-weight:700}
.modal-b{padding:20px}
.wopt{display:flex;align-items:center;gap:14px;width:100%;padding:15px 16px;border:1px solid var(--line);margin-bottom:10px;transition:.14s;text-align:left}
.wopt:hover{border-color:var(--fed);background:var(--panel2)}
.wopt .ic{width:34px;height:34px;display:grid;place-items:center;font-family:var(--mono);font-weight:600;font-size:15px}
.wopt .nm{font-size:15px;font-weight:600;letter-spacing:.06em}
.wopt .ds{font-family:var(--mono);font-size:10.5px;color:var(--faint)}

.split{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.fchoice{border:1px solid var(--line);padding:20px;text-align:center;transition:.15s;background:var(--panel2)}
.fchoice:hover{transform:translateY(-2px)}
.fchoice.f:hover,.fchoice.f.sel{border-color:var(--fed);background:rgba(46,155,255,.09)}
.fchoice.r:hover,.fchoice.r.sel{border-color:var(--rep);background:rgba(240,74,46,.09)}
.fchoice .em{width:60px;height:60px;margin:0 auto 12px}
.fchoice h4{font-size:17px;letter-spacing:.12em;text-transform:uppercase;font-weight:700}
.fchoice p{font-size:12px;color:var(--dim);margin-top:6px;line-height:1.4}

.ledger{font-family:var(--mono);font-size:12px;border:1px solid var(--line);background:var(--board)}
.ledger div{display:flex;justify-content:space-between;gap:18px;padding:8px 13px;border-bottom:1px solid var(--line)}
.ledger div span:last-child{text-align:right;white-space:nowrap}
.ledger div:last-child{border:0}
.ledger span:first-child{color:var(--dim)}
.ledger .burn span:last-child{color:var(--rep)}

/* landing */
.hero{position:relative;border-bottom:1px solid var(--line);overflow:hidden;background:var(--board)}
.hero-in{max-width:1560px;margin:0 auto;padding:56px 22px 34px;position:relative;z-index:2}
.hero h1{
  font-size:clamp(52px,10.5vw,148px);font-weight:700;letter-spacing:.05em;line-height:.85;
  text-transform:uppercase;
}
.hero h1 span{-webkit-text-stroke:1.5px var(--dim);color:transparent}
.hero .sub{font-size:16px;color:var(--dim);max-width:56ch;margin-top:18px;line-height:1.5}
.hero .cta{display:flex;gap:12px;margin-top:26px;flex-wrap:wrap;align-items:center}
.classbar{
  display:flex;justify-content:space-between;font-family:var(--mono);font-size:10px;letter-spacing:.26em;
  color:var(--faint);padding:7px 22px;border-bottom:1px solid var(--line);background:var(--panel);
  text-transform:uppercase;
}
.marquee{overflow:hidden;border-top:1px solid var(--line);border-bottom:1px solid var(--line);background:var(--panel);padding:9px 0}
.marquee div{display:flex;gap:44px;white-space:nowrap;animation:mv 34s linear infinite;font-family:var(--mono);font-size:11px;color:var(--dim)}
@keyframes mv{from{transform:translateX(0)}to{transform:translateX(-50%)}}
.marquee b{color:var(--amber);font-weight:500}

.foot{padding:26px 22px;border-top:1px solid var(--line);color:var(--faint);font-family:var(--mono);font-size:11px;display:flex;justify-content:space-between;gap:20px;flex-wrap:wrap}

.notice{
  display:flex;gap:10px;align-items:flex-start;border:1px solid var(--amber);
  background:rgba(255,176,32,.07);padding:11px 14px;font-size:12px;color:var(--amber);
  font-family:var(--mono);line-height:1.45;
}

/* toast */
.toasts{position:fixed;right:18px;bottom:18px;z-index:95;display:flex;flex-direction:column;gap:8px;max-width:340px}
.toast{border:1px solid var(--line2);background:var(--panel);padding:12px 15px;animation:up .25s ease;font-size:12.5px}
.toast .t{font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:var(--amber);font-family:var(--mono)}
.toast .m{color:var(--dim);margin-top:3px}

@media(max-width:1180px){
  .warlayout{grid-template-columns:1fr}
  .deck{grid-template-columns:repeat(2,1fr)}
  .deck .fire{grid-column:1/-1}
  .rung{grid-template-columns:44px 1fr;row-gap:10px}
  .rung .mult{text-align:left}
  .grid4{grid-template-columns:repeat(2,1fr)}
}
@media(max-width:760px){
  .page{padding:14px}
  .topbar{flex-wrap:wrap}
  .brand{flex:1;padding:12px 14px;border-right:0}
  .topright{border-left:0;padding:0 12px}
  .nav{flex:1 0 100%;border-top:1px solid var(--line)}
  .nav button{padding:12px 13px;font-size:10.5px;letter-spacing:.1em}
  .wallet{padding:5px 8px;font-size:10px}
  .plot-corner{font-size:8px;letter-spacing:.1em}
  .pc-tr,.plot-legend,.pc-bl{display:none}
  .page-head h1{font-size:23px}
  .grid2,.grid3,.grid4,.split{grid-template-columns:1fr}
  .resil{grid-template-columns:1fr}
  .resil .mid{border-left:0;border-right:0;border-top:1px solid var(--line);border-bottom:1px solid var(--line)}
  .topright .season-clock{display:none}
  .deck{grid-template-columns:1fr}
  .hero-in{padding:34px 14px 26px}

<script>

/* ============================================================
   Warroom — simplified MVP prototype
   One global enemy. Launch, upgrade, rank up, earn.
   Front-end only: wallet, mint, randomness and payouts simulated.
   ============================================================ */
const DEMO = { cooldownSec: 25, roundSec: 75, calcSec: 6 };   // 5h round shown as 75s
const ROUND_HOURS = 5;
const CLERK_FEE = 0.005;   // 0.5% to whoever triggers the transaction
const CHAIN = { name:'Robinhood Chain', id:4663, explorer:'https://robinhoodchain.blockscout.com' };
const PAIR = 'WAR / PLTR';

/* Fill these in at deploy. Everything on the site reads from here. */
const CONTRACTS = [
  { k:'ERC-721', nm:'Commander NFT — collection', addr:null, note:'1,200 max · no wallet limit · rank resets on transfer' },
  { k:'ERC-20',  nm:'WAR token',                  addr:null, note:'Fixed supply 1,000,000,000 · pairs against PLTR' },
  { k:'Rewards',  nm:'Reward pool',                addr:null, note:'Trading fees in, daily ETH distribution out' },
];

/* Off-site links. Fill swap in when the pool is seeded. */
const LINKS = { swap:null, x:'https://x.com/warroom' };   // swap = the WAR/PLTR pool

const MISSILES = [
  { lvl:1, dmg:100,  hits:0,  cost:0      },
  { lvl:2, dmg:250,  hits:10, cost:50000  },
  { lvl:3, dmg:600,  hits:30, cost:150000 },
  { lvl:4, dmg:1500, hits:75, cost:500000 },
];
const RANKS = [
  { id:0, name:'RECRUIT', mult:1.0, hits:0,  days:0, cost:0,      buy:null,     seats:null },
  { id:1, name:'CAPTAIN', mult:1.4, hits:10, days:1, cost:100000, buy:250000,   seats:null },
  { id:2, name:'MAJOR',   mult:1.9, hits:30, days:3, cost:300000, buy:750000,   seats:100  },
  { id:3, name:'COLONEL', mult:2.5, hits:75, days:7, cost:900000, buy:2250000,  seats:30   },
  { id:4, name:'GENERAL', mult:4.0, hits:null, days:null, cost:null, buy:null,  seats:10 },
];
/* Challenge deposits — the mechanic turns on when a capped rank is full,
   and it is the only route into General even when a seat is empty. */
const DEPOSIT = { 2:180000, 3:380000, 4:800000 };
const DEFEND_HOURS = 72, PROTECT_DAYS = 7;
const INTERCEPT = 0.30;          // one global intercept chance — level only changes damage
const ENEMY_MAX = 100000000;
const SUPPLY = { cap:1200, minted:341 };   // Commander NFTs are capped

const S = {
  screen:'landing', connected:false, wrongNet:false, addr:'0x7F3a…9C2b',
  enemy:{ hp:64200000, damageToday:18420000, cycle:11 },
  cmd:null, owned:[], activeIdx:0, wallet_war:2400000, feed:[],
  seats:{ 2:87, 3:28 },
  pool:{
    chest: 1.4820,          // PLTR sitting in the rewards contract right now
    roundNo: 47,
    endsAt: Date.now()+DEMO.roundSec*1000,
    status: 'open',         // open → calculating → open
    othersWeight: 1520,     // weight of every other active commander
    accrued: 0,             // cumulative ETH ever credited to this commander
    claimed: 0,             // cumulative ETH already withdrawn
    carried: 0,             // rolled over from empty rounds and rounding dust
    history: [],
  },
  challenge:null, underAttack:null,
  totals:{ players:9420, burned:38421000, launches:214800 },
};

const el = id => document.getElementById(id);
const fmt = n => Math.round(n).toLocaleString('en-US');
const pltr = n => n.toFixed(4)+' PLTR';
const short = n => n>=1e9?(n/1e9).toFixed(2)+'B':n>=1e6?(n/1e6).toFixed(2)+'M':n>=1e3?(n/1e3).toFixed(0)+'K':String(Math.round(n));
const now = () => Date.now();
const clock = ms => { if(ms<0)ms=0; const s=Math.floor(ms/1000),d=Math.floor(s/86400),h=Math.floor(s%86400/3600),m=Math.floor(s%3600/60),x=s%60,p=v=>String(v).padStart(2,'0');
  return d>0?`${d}d ${p(h)}:${p(m)}:${p(x)}`:`${p(h)}:${p(m)}:${p(x)}`; };
const missile = () => MISSILES[(S.cmd?.lvl||1)-1];
const rank = () => RANKS[S.cmd?.rank||0];
const ageDays = () => S.cmd ? (now()-S.cmd.minted)/864e5 : 0;
/* Activity is measured against the current round, not a rolling 24 hours:
   one launch since the last round closed puts you in the snapshot. */
const isActive = () => !!S.cmd?.activeThisRound;
const myWeight = () => isActive() ? rank().mult : 0;
const roundPool = () => S.pool.chest + S.pool.carried;
const myShare = () => { const w=myWeight(); if(!w) return 0;
  return roundPool() * w / (S.pool.othersWeight + w); };
const pendingOf = c => Math.max(0, c.accrued - c.claimed);
const pending = () => S.cmd ? pendingOf(S.cmd) : 0;
const walletPending = () => S.owned.reduce((t,c)=>t+pendingOf(c),0);
const walletWeight = () => S.owned.reduce((t,c)=>t+(c.activeThisRound?RANKS[c.rank].mult:0),0);
const shareOf = c => { const w=c.activeThisRound?RANKS[c.rank].mult:0; if(!w) return 0;
  return roundPool()*w/(S.pool.othersWeight+myWeightAll()); };
const myWeightAll = () => S.owned.reduce((t,c)=>t+(c.activeThisRound?RANKS[c.rank].mult:0),0);
const hasCommander = () => S.owned.length>0;
const setActive = i => { S.activeIdx=i; S.cmd=S.owned[i]; };

/* ---------- reward rounds ---------- */
function closeRound(byMe){
  const P=S.pool;
  if(P.status!=='closable') return;
  const gross=roundPool(), tip=gross*CLERK_FEE;
  P.status='calculating';
  if(byMe){ S.cmd.accrued+=tip; S.cmd.tips+=tip;
    push(`<b>You</b> closed round <b>#${P.roundNo}</b> — clerk fee <b>${pltr(tip)}</b> credited to Commander #${S.cmd.id}`, true);
    toast('Round closed',`You triggered it, so ${pltr(tip)} of the pool is yours on top of every share your commanders earned.`); }
  else { const who=1000+Math.floor(Math.random()*900);
    push(`Commander <b>#${who}</b> closed round <b>#${P.roundNo}</b> and kept the <b>${pltr(tip)}</b> clerk fee`); }
  render();
  setTimeout(()=>{
    const pool=gross-tip;
    const mine=S.owned.filter(c=>c.activeThisRound);
    const mineWeight=mine.reduce((t,c)=>t+RANKS[c.rank].mult,0);
    const total=P.othersWeight+mineWeight;
    if(total<=0 || pool<=0){
      P.carried=pool; P.chest=0;
      P.history.unshift({ no:P.roundNo, pool:gross, tip, weight:0, share:0, count:0, status:'rolled' });
      push(`Round <b>#${P.roundNo}</b> had no active commanders — <b>${pltr(pool)}</b> rolled into the next round`);
    } else {
      let mineShare=0;
      /* Each NFT is settled separately: its own weight, its own credit line.
         A wallet holding several simply gets several credits. */
      S.owned.forEach(c=>{
        const w = c.activeThisRound ? RANKS[c.rank].mult : 0;
        const share = w ? pool*w/total : 0;
        c.accrued += share; mineShare += share;
        c.rounds.unshift({ no:P.roundNo, weight:w, share, status: w?'paid':'missed' });
        if(c.rounds.length>12) c.rounds.pop();
      });
      const paid=pool*total/total;
      P.carried=Math.max(0,pool-paid); P.chest=0;
      P.history.unshift({ no:P.roundNo, pool:gross, tip, weight:mineWeight, share:mineShare,
        count:mine.length, status: mine.length?'paid':'missed' });
      if(mine.length) push(`Round <b>#${P.roundNo}</b> settled — <b>${pltr(mineShare)}</b> credited across <b>${mine.length}</b> of your commanders`, true);
      else push(`Round <b>#${P.roundNo}</b> settled — none of your commanders were in the snapshot`, true);
      if(mine.length) toast('Round settled',`${pltr(mineShare)} credited across ${mine.length} commander${mine.length>1?'s':''}.`);
      else toast('Round missed','No launches since the last close, so every one of your commanders had zero weight.');

    if(P.history.length>12) P.history.pop();

const TOAST_MS = 5000, TOAST_MAX = 4;
function dismissToast(d){
  if(!d || d.dataset.going) return;
  d.dataset.going='1'; clearTimeout(d._timer);
  d.classList.add('settled','out');
  d.addEventListener('transitionend',()=>d.remove(),{once:true});
  setTimeout(()=>d.remove(), 400);          // hard floor: a toast can never get stuck
}
function toast(t,m){
  const box=el('toasts');
  /* Count only toasts that are not already leaving: dismissToast removes the node
     asynchronously, so counting children would spin forever here. */
  let live=[...box.children].filter(x=>!x.dataset.going);
  while(live.length>=TOAST_MAX){
    const old=live.shift();
    old.dataset.going='1'; clearTimeout(old._timer); old.remove();
  }
  const d=document.createElement('div'); d.className='toast';
  d.innerHTML=`<button class="x" data-act="toast-close" title="Dismiss" aria-label="Dismiss">×</button>
    <div class="t">${t}</div><div class="m">${m}</div>
    <span class="life" style="animation-duration:${TOAST_MS}ms"></span>`;
  box.appendChild(d);
  d.addEventListener('animationend', e=>{ if(e.animationName==='toastIn') d.classList.add('settled'); });
  d._timer = setTimeout(()=>dismissToast(d), TOAST_MS);
}

/* ============================================================
   PLOT BOARD — one enemy in the centre, players firing inward.
   Abstract shapes only: no real geography, routes or targets.
   ============================================================ */
const W=1200,H=560,CX=600,CY=285;
let flights=[],blooms=[],sweep=0,ctx=null,shake=0;
const ENEMY=[[600,155],[700,190],[745,265],[720,350],[640,405],[545,400],[478,340],[462,255],[510,185]];
const SILOS=[[110,120],[280,90],[900,95],[1080,140],[95,430],[300,470],[880,475],[1090,420],[140,275],[1065,290]];

function poly(p,stroke,fill,w=1.4){ ctx.beginPath(); ctx.moveTo(p[0][0],p[0][1]);
  for(let i=1;i<p.length;i++) ctx.lineTo(p[i][0],p[i][1]); ctx.closePath();
  if(fill){ctx.fillStyle=fill;ctx.fill();} ctx.strokeStyle=stroke; ctx.lineWidth=w; ctx.stroke(); }

function drawBoard(){
  const sx = shake>0 ? (Math.random()-.5)*shake : 0, sy = shake>0 ? (Math.random()-.5)*shake : 0;
  if(shake>0) shake-=0.4;
  ctx.setTransform(1,0,0,1,sx,sy);
  ctx.fillStyle='#0E1216'; ctx.fillRect(-10,-10,W+20,H+20);
  ctx.strokeStyle='rgba(74,92,103,.15)'; ctx.lineWidth=1;
  for(let x=0;x<=W;x+=40){ctx.beginPath();ctx.moveTo(x,0);ctx.lineTo(x,H);ctx.stroke();}
  for(let y=0;y<=H;y+=40){ctx.beginPath();ctx.moveTo(0,y);ctx.lineTo(W,y);ctx.stroke();}
  ctx.strokeStyle='rgba(240,74,46,.16)';
  for(let r=140;r<=560;r+=100){ctx.beginPath();ctx.arc(CX,CY,r,0,7);ctx.stroke();}
  sweep+=0.005; if(sweep>Math.PI*2) sweep=0;
  const g=ctx.createLinearGradient(CX,CY,CX+Math.cos(sweep)*620,CY+Math.sin(sweep)*620);
  g.addColorStop(0,'rgba(255,176,32,.14)'); g.addColorStop(1,'rgba(255,176,32,0)');
  ctx.strokeStyle=g; ctx.lineWidth=2.5; ctx.beginPath(); ctx.moveTo(CX,CY);
  ctx.lineTo(CX+Math.cos(sweep)*620,CY+Math.sin(sweep)*620); ctx.stroke();
  // defence shell — thickness tracks remaining HP
  const frac=S.enemy.hp/ENEMY_MAX;
  ctx.setLineDash([9,7]); ctx.strokeStyle=`rgba(240,74,46,${.25+frac*.4})`; ctx.lineWidth=1.6;
  ctx.beginPath(); ctx.arc(CX,CY,175,0,7); ctx.stroke(); ctx.setLineDash([]);
  poly(ENEMY,'rgba(240,74,46,.9)',`rgba(240,74,46,${.05+frac*.09})`,1.8);
  // inner keep
  ctx.strokeStyle='rgba(240,74,46,.5)'; ctx.lineWidth=1;
  ctx.beginPath(); ctx.arc(CX,CY,44,0,7); ctx.stroke();
  ctx.beginPath(); ctx.arc(CX,CY,22,0,7); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(CX-58,CY); ctx.lineTo(CX+58,CY); ctx.moveTo(CX,CY-58); ctx.lineTo(CX,CY+58); ctx.stroke();
  // silos
  ctx.strokeStyle='rgba(46,155,255,.55)'; ctx.fillStyle='rgba(46,155,255,.55)';
  SILOS.forEach(([x,y])=>{ ctx.lineWidth=1.2;
    ctx.beginPath(); ctx.arc(x,y,7,0,7); ctx.stroke();
    ctx.beginPath(); ctx.arc(x,y,2.4,0,7); ctx.fill(); });
  ctx.font='400 11px "IBM Plex Mono",monospace';
  ctx.fillStyle='rgba(240,74,46,.85)'; ctx.fillText('GLOBAL ENEMY', CX-42, 138);
  ctx.fillStyle='rgba(74,92,103,.8)';
  ctx.fillText('COMMANDER SILOS', 40, 40);
}
function launchArc(mine=false,hit=true,lvl=1){
  const s=SILOS[Math.floor(Math.random()*SILOS.length)];
  const t=ENEMY[Math.floor(Math.random()*ENEMY.length)];
  const dst=[t[0]+(Math.random()*40-20), t[1]+(Math.random()*40-20)];
  flights.push({x0:s[0],y0:s[1],x1:dst[0],y1:dst[1],p:0,speed:.0058+lvl*.0006,
    arc:110+Math.random()*80,hit,mine,lvl,stop:hit?1:.72+Math.random()*.12,trail:[]});
}
function bez(f,p){ const mx=(f.x0+f.x1)/2,my=Math.min(f.y0,f.y1)-f.arc,q=1-p;
  return [q*q*f.x0+2*q*p*mx+p*p*f.x1, q*q*f.y0+2*q*p*my+p*p*f.y1]; }
function drawFlights(){
  for(let i=flights.length-1;i>=0;i--){ const f=flights[i]; f.p+=f.speed;
    const [x,y]=bez(f,Math.min(f.p,f.stop));
    f.trail.push([x,y]); if(f.trail.length>44) f.trail.shift();
    ctx.lineWidth=f.mine?2.4:1.2;
    for(let k=1;k<f.trail.length;k++){
      ctx.strokeStyle=f.mine?`rgba(255,176,32,${(k/f.trail.length)*.95})`:`rgba(46,155,255,${(k/f.trail.length)*.5})`;
      ctx.beginPath(); ctx.moveTo(f.trail[k-1][0],f.trail[k-1][1]); ctx.lineTo(f.trail[k][0],f.trail[k][1]); ctx.stroke(); }
    ctx.fillStyle=f.mine?'#FFB020':'rgba(46,155,255,.95)';
    ctx.beginPath(); ctx.arc(x,y,f.mine?4:2.4,0,7); ctx.fill();
    if(f.p>=f.stop){ blooms.push({x,y,r:0,hit:f.hit,mine:f.mine});
      if(f.hit&&f.mine) shake=7; flights.splice(i,1); } }
}
function drawBlooms(){
  for(let i=blooms.length-1;i>=0;i--){ const b=blooms[i]; b.r+=b.hit?2.1:1.2;
    const a=Math.max(0,1-b.r/(b.hit?58:32));
    if(b.hit){ ctx.strokeStyle=`rgba(${b.mine?'255,176,32':'240,74,46'},${a})`; ctx.lineWidth=2;
      ctx.beginPath(); ctx.arc(b.x,b.y,b.r,0,7); ctx.stroke();
      ctx.fillStyle=`rgba(${b.mine?'255,176,32':'240,74,46'},${a*.15})`;
      ctx.beginPath(); ctx.arc(b.x,b.y,b.r*.7,0,7); ctx.fill(); }
    else { ctx.strokeStyle=`rgba(124,146,158,${a})`; ctx.lineWidth=1.4; ctx.beginPath();
      ctx.moveTo(b.x-b.r,b.y-b.r); ctx.lineTo(b.x+b.r,b.y+b.r);
      ctx.moveTo(b.x+b.r,b.y-b.r); ctx.lineTo(b.x-b.r,b.y+b.r); ctx.stroke(); }
    if(a<=0) blooms.splice(i,1); }
}
function loop(){ const c=el('plot');
  if(c){ if(!ctx||ctx.canvas!==c){ c.width=W;c.height=H;ctx=c.getContext('2d'); }
    drawBoard(); drawFlights(); drawBlooms(); ctx.setTransform(1,0,0,1,0,0); }
  requestAnimationFrame(loop); }

  return `<svg class="av" width="${size}" height="${size}" viewBox="0 0 16 16" style="background:#0E1216;border:1px solid var(--line)">${cells}</svg>`;
}

            <div class="s">${isActive()?`round #${S.pool.roundNo} closes in `:'launch once to enter round #'+S.pool.roundNo+' · '}<span data-tick="round2">${clock(S.pool.endsAt-now())}</span></div></div>
          <div class="cell"><div class="k">Your damage</div><div class="v num">${fmt(c.damage)}</div>
            <div class="s">${c.hits} hits of ${c.launches} launches</div></div>
        </div>
        <div class="panel" style="margin-top:20px"><div class="panel-b" style="display:flex;gap:20px;align-items:center;flex-wrap:wrap">
          <div style="flex:1;min-width:280px">
            <div class="eyebrow">Commanders on this wallet</div>
            <div style="font-size:19px;font-weight:400;margin-top:6px">${S.owned.length} held${S.owned.length>1?` · combined weight ${myWeightAll().toFixed(1)}x this round`:''}</div>
            <p class="dim" style="font-size:13px;margin-top:6px;line-height:1.55">Every Commander is a separate character with its own rank and its own share of the pool. ${fmt(SUPPLY.cap-SUPPLY.minted)} of ${fmt(SUPPLY.cap)} are still unminted.</p>

          </div>
        </div></div>
        ${!isActive()&&c.launches>0?`<div class="notice" style="margin-top:14px">You are not in round #${S.pool.roundNo}. One launch since the last round closed is all it takes to be counted.</div>`:''}

      <div class="panel"><div class="panel-h"><h3>Activity</h3><span class="eyebrow">Live</span></div><div class="feed" id="feed"></div></div>

}
function leaderRows(){
  const c=S.cmd;
  const rows=[...PLAYERS,{id:c.id,cs:'YOU',dmg:c.damage,lvl:c.lvl,me:true}].sort((a,b)=>b.dmg-a.dmg).slice(0,10);
  return rows.map((p,i)=>`<tr class="${p.me?'me':''}"><td class="rk ${i<3?'top':''}">${String(i+1).padStart(2,'0')}</td>
    <td><div class="cmdr">${avatar(p.id)}<div><div style="font-weight:600;letter-spacing:.05em">${p.cs}${p.me&&S.cmd.bought?' <span class="mark">Bought</span>':''}</div><div class="eyebrow">#${p.id}</div></div></div></td>
    <td class="dim">Level ${p.lvl}</td><td class="num" style="text-align:right">${fmt(p.dmg)}</td></tr>`).join('');
}

/* ---------- UPGRADE ---------- */
function screenUpgrade(){
  const c=S.cmd;
  return `<div class="page">
    <div class="page-head"><div><h1>Upgrade</h1>
      <p>Missile level decides how much damage a hit does. Nothing else. Half of every upgrade fee is burned.</p></div>
      <span class="tag tag-amb">${c.hits} SUCCESSFUL Target hitS</span></div>
    <div class="grid4">${MISSILES.map(m=>{
      const owned=c.lvl===m.lvl, past=c.lvl>m.lvl, seq=m.lvl===c.lvl+1;
      const hitsOk=c.hits>=m.hits, warOk=S.wallet_war>=m.cost, can=seq&&hitsOk&&warOk;
      return `<div class="mcard ${owned?'owned':''} ${!owned&&!past&&!can?'locked':''}">
        <div class="top"><div><div class="tier">LEVEL ${m.lvl}</div><div class="nm">${fmt(m.dmg)}<span style="font-size:13px" class="dim"> DMG</span></div></div>
          ${owned?'<span class="tag tag-fed">Equipped</span>':past?'<span class="tag tag-off">Passed</span>':''}</div>
        <div class="silo">${Array.from({length:12},(_,i)=>`<i style="height:${14+((i*11+m.lvl*17)%8)*4+m.lvl*9}%;${owned?'background:var(--fed)':''}"></i>`).join('')}</div>
        <div class="foot">${owned?'<div class="eyebrow">Currently equipped</div>':past?'<div class="eyebrow">Superseded</div>'
          :`<div class="ledger" style="margin-bottom:11px">
              <div><span>Requires</span><span class="${hitsOk?'':'rep'}">${m.hits} hits</span></div>
              <div><span>Cost</span><span>${fmt(m.cost)} WAR</span></div>
              <div class="burn"><span>Burned</span><span>${fmt(m.cost*.5)} WAR</span></div></div>
            ${!hitsOk?`<div class="bar" style="margin-bottom:10px"><i style="transform:scaleX(${Math.min(1,c.hits/m.hits).toFixed(4)})"></i></div>`:''}
            <button class="btn btn-block ${can?'btn-fed':''}" data-act="upgrade" data-v="${m.lvl}" ${can?'':'disabled'}>

    <div class="notice" style="margin-top:14px">Missile level is power. Rank is reward. The two never mix.</div>
  </div>`;
}

/* ---------- RANK ---------- */
const reqHits = r => S.cmd.bought ? Math.ceil(r.hits*1.5) : r.hits;

function screenRank(){
  const c=S.cmd;
  return `<div class="page">
    <div class="page-head"><div><h1>Rank</h1>
      <p>Rank does one thing: it multiplies your share of the daily rewards. You can earn a rank with hits and time, or buy it outright with WAR — except General, which is only ever taken by challenge.</p></div>
      <span class="tag tag-amb">Your rank gives you ${rank().mult.toFixed(1)}x rewards</span></div>
    ${c.bought?`<div class="notice" style="margin-bottom:14px">Your commission was bought. The mark stays on your file, and the next promotion costs 50% more hits.</div>`:''}
    <div class="ladder">${RANKS.map((r,i)=>{
      const cur=c.rank===i, done=c.rank>i, next=c.rank+1===i;
      const taken=r.seats?(i===4?generalsHeld():S.seats[i]):null;
      const full=r.seats&&taken>=r.seats;
      const need=r.hits!==null?reqHits(r):null;
      const hitsOk=need!==null&&c.hits>=need, ageOk=r.days!==null&&ageDays()>=r.days, warOk=r.cost!==null&&S.wallet_war>=r.cost;
      const canEarn=next&&hitsOk&&ageOk&&warOk&&!full&&i!==4;
      const canBuy=next&&r.buy&&S.wallet_war>=r.buy&&!full;
      return `<div class="rung ${cur?'cur':''} ${done?'done':''}">
        <div class="chev"><b>${['I','II','III','IV','V'][i]}</b>${cur?'YOU':done?'Held':''}</div>
        <div><h4>${r.name}${i===4?' <span class="eyebrow">— challenge only, even when a seat is empty</span>':''}</h4>
          <div class="req">${i===4?`Ten seats in the whole game. A Colonel takes one by challenge or by claiming a vacant chair.`
            :`${r.hits?need+' successful hits':'no requirement'} · ${r.days?r.days+' day'+(r.days>1?'s':'')+' since mint':'immediate'} · ${r.cost?fmt(r.cost)+' WAR':'free'}${c.bought&&next&&r.hits?` <span class="rep">(+50% — bought commission)</span>`:''}`}</div>
          ${r.seats?`<div class="seats">${Array.from({length:r.seats},(_,k)=>`<i class="${k<taken?'taken':'free'}"></i>`).join('')}</div>
            <div class="eyebrow" style="margin-top:5px">${taken} / ${r.seats} seats occupied${full?' — full, challenge only':''}</div>`:''}
          ${next&&need&&!hitsOk?`<div class="bar" style="margin-top:9px;max-width:340px"><i style="transform:scaleX(${Math.min(1,c.hits/need).toFixed(4)})"></i></div>
            <div class="eyebrow" style="margin-top:5px">${c.hits} / ${need} hits</div>`:''}</div>
        <div class="mult"><span>REWARDS</span>${r.mult.toFixed(1)}x</div>
        <div>${done?'<span class="tag tag-off">Passed</span>'
          : cur?'<span class="tag tag-amb">Current</span>'
          : i===4?`<button class="btn btn-sm btn-block ${c.rank===3?'btn-amber':''}" data-act="scroll-gen" ${c.rank===3?'':'disabled'}>${c.rank===3?'Go to the ten seats':'Colonels only'}</button>`
          : next?`${full?`<button class="btn btn-sm btn-block btn-amber" data-act="scroll-seats" data-v="${i}">Seats full — challenge</button>`
              :`<button class="btn btn-sm btn-block ${canEarn?'btn-fed':''}" data-act="promote" ${canEarn?'':'disabled'} style="margin-bottom:6px">
                  ${!hitsOk?`${need-c.hits} more hits`:!ageOk?`${Math.ceil(r.days-ageDays())}d to wait`:!warOk?'Not enough WAR':`Earn it — ${short(r.cost)} WAR`}</button>
                <button class="btn btn-sm btn-block ${canBuy?'btn-amber':''}" data-act="buyrank" ${canBuy?'':'disabled'}>Buy rank — ${short(r.buy)} WAR</button>`}`
          : '<span class="tag tag-off">Locked</span>'}</div></div>`;
    }).join('')}</div>

    <div class="grid2" style="margin-top:14px">
      <div class="panel"><div class="panel-h"><h3>Earn it</h3></div><div class="panel-b">
        <p class="dim" style="font-size:13px;line-height:1.55">Land the hits, serve the days, pay the promotion fee. Slower, but your file stays clean and the next rung costs what it says on the ladder.</p>
        <div class="ledger" style="margin-top:12px">
          <div><span>Captain</span><span>10 hits · 1 day · 100,000 WAR</span></div>
          <div><span>Major</span><span>30 hits · 3 days · 300,000 WAR</span></div>
          <div><span>Colonel</span><span>75 hits · 7 days · 900,000 WAR</span></div>
        </div></div></div>
      <div class="panel"><div class="panel-h"><h3>Buy it</h3><span class="tag tag-amb">From day one</span></div><div class="panel-b">
        <p class="dim" style="font-size:13px;line-height:1.55">Skip the hits and the wait entirely. Ranks are bought one step at a time, and a full rank cannot be bought into — that is what the challenge is for.</p>
        <div class="ledger" style="margin-top:12px">
          <div><span>Captain</span><span>250,000 WAR</span></div>
          <div><span>Major</span><span>750,000 WAR</span></div>
          <div><span>Colonel</span><span>2,250,000 WAR</span></div>
          <div class="burn"><span>Burned on purchase</span><span>50%</span></div>
          <div><span>Marked on your file</span><span class="rep">permanently</span></div>
          <div><span>Next rung after a purchase</span><span class="rep">+50% hits</span></div>
        </div>
        <div class="eyebrow" style="margin-top:11px">General is the exception. No amount of WAR buys a chair.</div>
      </div></div>
    </div>

    ${S.underAttack?defenderPanel():''}
    ${S.challenge?challengePanel():''}

    <div class="panel" id="generals" style="margin-top:14px">
      <div class="panel-h"><h3>The ten Generals</h3><span class="eyebrow">${generalsHeld()} of 10 seats held · deposit ${fmt(DEPOSIT[4])} WAR</span></div>
      ${GENERALS.map((g,i)=>{
        if(g.vacant) return `<div class="gen-row">
          <div class="slot">#${String(i+1).padStart(2,'0')}</div>
          <div class="cmdr"><svg class="av" width="22" height="22" viewBox="0 0 16 16" style="background:#0B1116;border:1px dashed var(--line2)"></svg>
            <div><div style="font-weight:600;letter-spacing:.05em" class="dim">Vacant seat</div><div class="eyebrow">No one holds it</div></div></div>
          <div><div class="eyebrow">Lifetime damage</div><div class="num dim" style="font-size:14px">—</div></div>
          <div><div class="eyebrow">Status</div><div class="num" style="font-size:14px">Open</div></div>
          <div style="text-align:right"><button class="btn btn-sm ${claimable()?'btn-amber':''}" data-act="claim-seat" data-v="${i}" ${claimable()?'':'disabled'}>
            ${S.challenge?'One at a time':S.cmd.rank!==3?'Colonels only':S.wallet_war<DEPOSIT[4]?'Deposit too high':'Claim seat'}</button></div></div>`;
        const mine = g.cs==='YOU';
        const can=S.cmd.rank===3&&!g.shield&&!S.challenge&&S.wallet_war>=DEPOSIT[4];
        return `<div class="gen-row" ${mine?'style="background:rgba(255,176,32,.06)"':''}>
          <div class="slot">#${String(i+1).padStart(2,'0')}</div>
          <div class="cmdr">${avatar(g.id)}<div><div style="font-weight:600;letter-spacing:.05em">${g.cs} ${g.bought?'<span class="mark">Bought</span>':''}</div><div class="eyebrow">Commander #${g.id}</div></div></div>
          <div><div class="eyebrow">Lifetime damage</div><div class="num" style="font-size:14px">${fmt(g.dmg)}</div></div>
          <div><div class="eyebrow">General since</div><div class="num" style="font-size:14px">${g.since}d ago</div></div>
          <div style="text-align:right">${mine?'<span class="tag tag-amb">Your seat</span>'
            : g.shield?`<span class="shield">◇ Protected ${g.shield}d</span>`
            : `<button class="btn btn-sm ${can?'btn-amber':''}" data-act="challenge" data-v="${i}" ${can?'':'disabled'}>
                ${S.challenge?'One at a time':S.cmd.rank!==3?'Colonels only':S.wallet_war<DEPOSIT[4]?'Deposit too high':'Challenge'}</button>`}</div></div>`;
      }).join('')}
    </div>

    <div class="panel" id="seats-major" style="margin-top:14px">
      <div class="panel-h"><h3>Deposits and outcomes</h3><span class="eyebrow">Same mechanic at every capped rank</span></div>
      <table><thead><tr><th>Seat</th><th>Deposit</th><th>Time to defend</th><th>If they defend</th><th>If they stay silent</th></tr></thead>
        <tbody>${[2,3,4].map(r=>`<tr><td style="font-weight:600">${RANKS[r].name}</td>
          <td class="num amb">${fmt(DEPOSIT[r])} WAR</td><td class="num">${DEFEND_HOURS}h</td>
          <td class="dim">They keep the seat · 49.5% of your deposit burns · ${PROTECT_DAYS}d protection</td>
          <td class="dim">You take the seat · they get 30% of your deposit · 69.5% burns</td></tr>`).join('')}</tbody></table>
      <div class="panel-b" style="border-top:1px solid var(--line)">
        <div class="notice">Whichever way it goes, a challenge burns WAR. The harder people fight over the ten chairs, the more supply disappears.</div>
        <div class="ledger" style="margin-top:12px">
          <div><span>Who settles an expired challenge</span><span>Anyone — keeps ${(CLERK_FEE*100).toFixed(1)}% of the deposit</span></div>
          <div><span>Where that fee comes from</span><span>The burned share, never from either party's entitlement</span></div>
        </div>
      </div></div>

    <div class="panel" style="margin-top:14px"><div class="panel-h"><h3>Selling your Commander</h3></div><div class="panel-b">
      <p class="dim" style="font-size:13px;line-height:1.55">The Commander NFT can be sold or transferred, but rank and progression do not travel with it. The buyer receives a Recruit with zero hits, so a finished General cannot be bought on the secondary market.</p>
      <div class="ledger" style="margin-top:12px">
        <div><span>Rank</span><span class="rep">resets to Recruit</span></div>
        <div><span>Successful hits</span><span class="rep">reset to zero</span></div>
        <div><span>Lifetime damage &amp; traits</span><span>kept on the token</span></div>
      </div></div></div>
  </div>`;
}
const claimable = () => S.cmd.rank===3 && !S.challenge && S.wallet_war>=DEPOSIT[4];

function challengePanel(){
  const ch=S.challenge, dep=ch.dep;
  return `<div class="panel" style="margin-top:14px;border-color:var(--amber)">
    <div class="panel-h" style="background:rgba(255,176,32,.1);border-bottom-color:var(--amber)">
      <h3 style="color:var(--amber)">${ch.claim?'Claiming the vacant chair':`Challenge against ${ch.target.cs}`}</h3>
      <span class="tag tag-amb" data-tick="chal">${clock(ch.endsAt-now())} ${ch.claim?'until the claim settles':'left to defend'}</span></div>
    <div class="panel-b">
      <p class="dim" style="font-size:13.5px;line-height:1.55">${ch.claim
        ? `Your deposit of ${fmt(dep)} WAR is locked. An empty chair is still won in the open — any other Colonel can post the same deposit and contest it before the clock runs out.`
        : `Your deposit of ${fmt(dep)} WAR is locked. If they post the same amount within ${DEFEND_HOURS} hours they keep the seat and half of yours is burned. If they stay silent, the seat is yours, they drop to Colonel and take 30% of your deposit as severance.`}</p>
      <div class="ledger" style="margin-top:14px">
        <div><span>Your deposit</span><span>${fmt(dep)} WAR</span></div>
        <div class="burn"><span>If they defend</span><span>${fmt(dep*0.5)} burned · ${fmt(dep*0.5)} returned</span></div>

      </div>
      <button class="btn btn-block btn-amber" style="margin-top:14px" data-act="resolve">Fast-forward the answer (demo)</button>
    </div></div>`;
}
function defenderPanel(){
  const a=S.underAttack;
  return `<div class="panel" style="margin-top:14px;border-color:var(--rep)">
    <div class="panel-h" style="background:rgba(240,74,46,.12);border-bottom-color:var(--rep)">
      <h3 style="color:#FF9E86">Your position is under attack</h3>
      <span class="tag tag-rep" data-tick="def">${clock(a.endsAt-now())} remaining</span></div>
    <div class="panel-b">
      <p style="font-size:14px;line-height:1.55">Commander <b>#${a.from}</b> challenged your General seat. Post the same deposit within ${DEFEND_HOURS} hours and you keep it — half of their deposit burns and nobody can touch your chair for ${PROTECT_DAYS} days. Ignore it and you drop to Colonel.</p>
      <div class="ledger" style="margin-top:14px">
        <div><span>Deposit required</span><span>${fmt(DEPOSIT[4])} WAR</span></div>
        <div><span>Your balance</span><span class="${S.wallet_war>=DEPOSIT[4]?'':'rep'}">${fmt(S.wallet_war)} WAR</span></div>
        <div><span>If you defend</span><span class="amb">Seat held · ${PROTECT_DAYS} days protection</span></div>
      </div>
      <div style="display:flex;gap:10px;margin-top:14px">
        <button class="btn btn-block btn-amber" data-act="defend" ${S.wallet_war>=DEPOSIT[4]?'':'disabled'}>Defend for ${fmt(DEPOSIT[4])} WAR</button>
        <button class="btn btn-block" data-act="concede">Let it go</button>
      </div></div></div>`;
}

/* ---------- REWARDS ---------- */

  return `<div class="page">
    <div class="page-head"><div><h1>Rewards</h1>

          ${S.owned.length>1?`<button class="btn btn-block ${walletPending()>0?'btn-fed':''}" style="margin-top:10px" data-act="claimall" ${walletPending()>0?'':'disabled'}>

          <div class="ledger" style="margin-top:14px">
            <div><span>Credited to #${c.id} in total</span><span>${pltr(c.accrued)}</span></div>

          </div>

    </div>

    ${S.owned.length>1?`<div class="panel" style="margin-top:14px"><div class="panel-h"><h3>Your commanders</h3>

    <div class="panel" style="margin-top:14px"><div class="panel-h"><h3>Recent rounds</h3>

const TOC = [
  ['what','What Warroom is'],['nft','The Commander NFT'],['war','WAR and the burn'],
  ['launch','Launching'],['target','The target and the cycle'],['missile','Missile levels'],['rank','Rank'],['buy','Buying a rank'],
  ['seats','Capped seats'],['challenge','The challenge'],['rewards','Rewards and claiming'],

  ['faq','FAQ'],['legal','Legal'],
];
const faq = (q,a) => `<details class="faq"><summary>${q}</summary><div class="a">${a}</div></details>`;

function screenDocs(){
  return `<div class="page">
    <div class="page-head"><div><h1>Docs</h1>
      <p>Everything Warroom does, written out in full: where the money comes from, what burns, how a seat changes hands, and what can go wrong.</p></div>
      <span class="eyebrow">Revision 0.1 · ${CHAIN.name}</span></div>
    <div class="docs">
      <nav class="toc">${TOC.map(([id,t],i)=>`<a href="#${id}"><i>${String(i+1).padStart(2,'0')}</i>${t}</a>`).join('')}</nav>
      <div class="doc">

        <section id="what"><h2>What Warroom is</h2>
          <p class="lead">Spend WAR to play. Earn PLTR as rewards. Every commander in the game shoots at the same target, lands hits, upgrades, climbs the ranks — and rank decides how large a slice of the reward pool you take.</p>
          <p>The two assets do two different jobs and never swap places. <b>WAR is the fuel:</b> minting, upgrading, buying rank and contesting a seat all cost WAR, and half of everything you spend is burned. <b>Tokenized PLTR is the reward:</b> it is what the rewards contract holds and what a settled round credits to your NFT.</p>
          <p>That split is the point. A game that pays rewards in its own token is really just printing and calling it yield. Here the token you spend only ever leaves circulation, and what comes back is a different asset entirely.</p>
          <p>Nothing in the game creates yield, either. The pool is trading fees collected on the ${PAIR} market and redistributed between NFT holders — if nothing trades, there is nothing to share. Rank changes the size of your slice, never whether a slice exists.</p>
          <p>The loop is short on purpose: <b>launch → land hits → upgrade and rank up → burn WAR → take a bigger slice of PLTR → come back tomorrow.</b> Everything else in these docs hangs off that line.</p></section>

        <section id="nft"><h2>The Commander NFT</h2>
          <p>The Commander is an ERC-721 token and it is three things at once: your pass into the game, your profile, and the place your progression is stored. Rank, missile level, successful hits, total damage, WAR spent and WAR burned all live on the token.</p>
          <ul>
            <li><b>Supply is capped at 1,200.</b> There will never be a 1,201st Commander.</li>
            <li><b>No limit per wallet.</b> Mint several at once, come back and mint more later, or buy them on the secondary market. Distribution across owners is free; only the total is fixed.</li>
            <li><b>Each token is a separate character.</b> Rank, missile level, hits, damage, WAR burned, challenge history and credited rewards all belong to the token, not to the wallet. Two Commanders on one address progress completely independently.</li>
            <li><b>Rewards are settled per NFT.</b> A wallet holding a Recruit, a Colonel and a General has three separate weights and receives three separate credits — 1.0x, 2.5x and 4.0x. Nothing is pooled at the wallet level except the convenience of claiming it all in one transaction.</li>
            <li><b>Capped seats are counted in NFTs, not owners.</b> One wallet may in principle hold more than one General seat if it wins more than one. There is no rule against it in the MVP.</li>
            <li><b>Mint price is 100,000 WAR</b>, of which half is burned on the spot. The rest splits between treasury, game economy and the reward pool.</li>
            <li><b>One Commander gets you into the game.</b> You start as a Recruit with a Level 1 missile and can launch immediately.</li>
            <li><b>Transfers reset progression.</b> Sell or gift the token and it arrives at its new owner as a Recruit with zero hits. Lifetime damage and visual traits stay on it.</li>
          </ul>
          <p>That last rule is the important one. It means a finished General cannot be bought on the secondary market — what changes hands is always an empty badge. If all 1,200 are minted, the only way in is to buy one from someone else and start from Recruit.</p>
          <p>Holding several is a real strategy rather than an oversight: each Commander needs its own launch to count as active in a round, so ten Commanders means ten launch transactions every round. Weight scales with what you hold, and so does the work.</p>
          <p>Full mint burns <b>${fmt(SUPPLY.cap*100000*0.5)} WAR</b> — 1,200 × 100,000 × 50% — which is 6% of total supply removed before anyone has fired a single missile.</p></section>

        <section id="war"><h2>WAR, the pair and the burn</h2>
          <p>WAR is an ERC-20 with a fixed supply of 1,000,000,000. There is no further emission, and rewards are never paid in it, so nothing dilutes it from the inside. The supply only moves in one direction.</p>
          <p>The market pair is <b>${PAIR}</b>. WAR is quoted against tokenized PLTR rather than against a stablecoin or a network asset, which means the base asset of the ecosystem is the same thing the game pays out. You buy WAR with PLTR, spend it to play, and earn PLTR back through rank.</p>
          <p>Every WAR spent inside the game follows the same rule: <b>50% is burned</b>, and the remainder goes to treasury, game economy and the reward pool in proportions set in the tokenomics.</p>
          <table><thead><tr><th>Spend</th><th>Cost</th><th>Burned</th></tr></thead><tbody>
            <tr><td>Mint a Commander</td><td class="num">100,000</td><td class="num rep">50,000</td></tr>
            <tr><td>Extra launch</td><td class="num">10,000</td><td class="num rep">5,000</td></tr>
            <tr><td>Missile upgrades (all four levels)</td><td class="num">700,000</td><td class="num rep">350,000</td></tr>
            <tr><td>Earned promotions to Colonel</td><td class="num">1,300,000</td><td class="num rep">650,000</td></tr>
            <tr><td>Bought ranks to Colonel</td><td class="num">3,250,000</td><td class="num rep">1,625,000</td></tr>
            <tr><td>General challenge — defended</td><td class="num">800,000</td><td class="num rep">400,000</td></tr>
            <tr><td>General challenge — unanswered</td><td class="num">800,000</td><td class="num rep">560,000</td></tr>
          </tbody></table>
          <p>Challenges are the heaviest sink in the game, and they burn either way. A defended seat burns half the challenger's deposit; an abandoned one burns 70% of it. The harder people fight over the ten chairs, the faster supply disappears.</p></section>

        <section id="launch"><h2>Launching</h2>
          <p>One free launch every <b>4 hours</b>. Unused launches do not stack — if you leave the slot idle, it is simply gone.</p>
          <p>Each launch resolves one of two ways. <b>Target hit</b> deals your missile's damage to the global enemy and counts as a successful hit toward upgrades and promotions. <b>Intercepted</b> deals nothing and counts for nothing.</p>
          <p>Not willing to wait, you can pay <b>10,000 WAR</b> for an extra launch — up to three a day. An extra launch is identical to a free one in every respect except that you paid for it.</p>
          <p><b>The result is never decided by the front end.</b> It comes from verifiable on-chain randomness, so nobody — including us — can know the outcome before the transaction lands. If a build ever lets the client pick the result, that build is broken.</p></section>

        <section id="target"><h2>The target and the cycle</h2>
          <p>Every commander shoots at the same target. It starts each cycle with <b>${fmt(ENEMY_MAX)} HP</b>, and every hit anyone lands takes that number down.</p>
          <p>When it reaches zero the target is <b>destroyed and instantly rebuilt</b> at full strength. The cycle counter goes up by one and everybody keeps playing without interruption. Nothing about your commander changes at a reset: rank, missile level, hits, damage and any seat you hold all carry straight over.</p>
          <p>The target exists to give a launch visible meaning and to make the damage counter shared. It does not pay anything by itself — rewards come from trading fees, and your share of them comes from rank.</p></section>

        <section id="missile"><h2>Missile levels</h2>
          <p>Your missile level decides one thing: how much damage a hit does. It does not affect your rewards, your rank or your chance of getting through.</p>
          <table><thead><tr><th>Level</th><th>Damage</th><th>Requires</th><th>Cost</th><th>Burned</th></tr></thead><tbody>
            ${MISSILES.map(m=>`<tr><td style="font-weight:600">Level ${m.lvl}</td><td class="num">${fmt(m.dmg)}</td>
              <td class="num">${m.hits?m.hits+' hits':'issued at mint'}</td><td class="num">${m.cost?fmt(m.cost):'—'}</td>
              <td class="num rep">${m.cost?fmt(m.cost*0.5):'—'}</td></tr>`).join('')}
          </tbody></table>
          <p>Upgrades are sequential — you cannot skip from Level 1 to Level 4 — and they are permanent.</p></section>

        <section id="rank"><h2>Rank</h2>
          <p>Rank decides one thing: how large your share of the daily rewards is. It has no effect on damage.</p>
          <table><thead><tr><th>Rank</th><th>Hits</th><th>Time since mint</th><th>Earn it</th><th>Buy it</th><th>Seats</th><th>Rewards</th></tr></thead><tbody>
            ${RANKS.map(r=>`<tr><td style="font-weight:600">${r.name}</td><td class="num">${r.hits??'—'}</td>
              <td class="num">${r.days?r.days+'d':'—'}</td><td class="num">${r.cost?fmt(r.cost):'—'}</td>
              <td class="num ${r.buy?'amb':''}">${r.buy?fmt(r.buy):'—'}</td>
              <td class="num">${r.seats??'unlimited'}</td><td class="num amb">${r.mult.toFixed(1)}x</td></tr>`).join('')}
          </tbody></table>
          <p>Earning a rank means three things at once: the hits, the days, and the promotion fee. All three have to be satisfied, and half of the fee burns.</p>
          <p><b>General is not on this ladder.</b> No promotion grants it, at any price, even when a chair is empty. The only route is the challenge.</p></section>

        <section id="buy"><h2>Buying a rank</h2>
          <p>Captain, Major and Colonel can be bought outright with WAR from the day you mint, skipping both the hits and the wait. Half of the purchase burns like any other spend.</p>
          <ul>
            <li>Ranks are bought <b>one step at a time</b> — Recruit to Colonel is three purchases, not one.</li>
            <li>You <b>cannot buy into a full rank</b>. When the seats are gone, the only route is a challenge.</li>
            <li>A bought rank is <b>marked on your file</b>, visibly, on the profile and the leaderboard.</li>
            <li>The <b>next promotion after a purchase costs 50% more hits</b> — Colonel becomes 113 hits instead of 75.</li>
          </ul>
          <p>The purpose of the split is not to punish spending. It is to keep money and work as two different routes with two different costs, so a large balance buys speed but never buys the top of the game.</p></section>

        <section id="seats"><h2>Capped seats</h2>
          <p>Three ranks have a fixed number of chairs: <b>100 Majors, 30 Colonels, 10 Generals</b>. The counters are visible on the rank screen at all times.</p>
          <p>While seats are free, a capped rank behaves like any other — earn it or buy it. Once the last seat is taken, promotion into that rank stops working entirely and the only remaining route is to take a chair off someone who is sitting in it.</p>
          <p>General is capped and challenge-only at the same time. Ten chairs, and even an empty one has to be claimed through the challenge mechanic rather than granted.</p></section>

        <section id="challenge"><h2>The challenge</h2>
          <p>You name a specific holder one rung above you and post that rank's deposit. They are notified and the clock starts.</p>
          <table><thead><tr><th>Seat</th><th>Deposit</th><th>Time to answer</th></tr></thead><tbody>
            ${[2,3,4].map(r=>`<tr><td style="font-weight:600">${RANKS[r].name}</td><td class="num amb">${fmt(DEPOSIT[r])} WAR</td><td class="num">${DEFEND_HOURS} hours</td></tr>`).join('')}
          </tbody></table>
          <p><b>If they defend.</b> They post the same deposit and keep the seat. There is no contest after that — the challenge ends immediately. Half of your deposit comes back to you and the rest is burned, less the settler's fee. Their own deposit returns to them in full, and the seat cannot be challenged again for ${PROTECT_DAYS} days.</p>
          <p><b>If they stay silent.</b> After ${DEFEND_HOURS} hours the seat is yours and they drop one rank. They receive 30% of your deposit as severance; the remaining 70% is burned.</p>
          <p>Worked through with the General deposit of ${fmt(DEPOSIT[4])} WAR: a successful defence returns ${fmt(DEPOSIT[4]*0.5)} to you and burns ${fmt(DEPOSIT[4]*0.495)}. An unanswered challenge sends ${fmt(DEPOSIT[4]*0.3)} to the ousted General and burns ${fmt(DEPOSIT[4]*0.695)}. In both cases ${fmt(DEPOSIT[4]*CLERK_FEE)} goes to whoever sent the closing transaction — taken out of the burn, not out of anybody's entitlement.</p>
          <p>One challenge at a time per commander, and a defended seat is untouchable for a week. That is what stops the ten chairs from being spun in circles by whoever has the deepest balance.</p></section>

        <section id="rewards"><h2>Rewards</h2>
          <p>The pool is funded by <b>reward fees taken from trading volume</b>. Every time WAR changes hands on the AMM the protocol collects a fee, and a share of it is routed into the rewards contract. Mechanically this is the same thing a liquidity provider does when they collect fees on Uniswap: it is fee redistribution between NFT holders, not a return generated by the protocol.</p>

          <h3 >The round</h3>
          <p>PLTR simply sits in the contract until a round closes. A round runs <b>${ROUND_HOURS} hours</b> and ends with a snapshot: which NFTs exist, what rank each one holds, which ones launched during the round, and who owns them.</p>
          <p><b>The snapshot is the cut-off.</b> A promotion bought after the round closes counts towards the next one, never retroactively towards the round being settled. Between the close and the result the round shows as <i>calculating</i>.</p>

          <h3 >The share</h3>
          <p>Each NFT in the snapshot gets a weight equal to its rank multiplier. The formula is the whole of it:</p>
          <p class="lead"><b>your share = round pool × your weight / total weight in the snapshot</b></p>
          <p>Say the pool is 1.5 PLTR and the weights of everyone in the snapshot add up to 1,525. A Colonel at 2.5 takes 2.5 / 1,525 of it — about 0.00246 PLTR. A General at 4.0 takes 0.00393 PLTR out of the same pool. Rank multiplies your slice; it does not make the pool bigger.</p>

          <h3 >Claiming</h3>
          <p>Nothing is sent to you automatically — pushing PLTR to a thousand addresses every round would cost more in gas than most of the payouts. Instead each settled round <b>credits your NFT</b>, and the credits add up.</p>
          <p>When you claim, the contract pays the difference between everything ever credited to you and everything you have already withdrawn. Twenty missed rounds come out in <b>one transaction</b>, whenever you choose. Nothing expires.</p>

          <h3 >Who closes the round</h3>
          <p>Somebody has to send the transaction that ends a round, and it should not have to be us. Once the timer runs out, <b>any wallet can trigger the close and keeps ${(CLERK_FEE*100).toFixed(1)}% of the pool</b> for the gas and the trouble. The remaining ${(100-CLERK_FEE*100).toFixed(1)}% is shared out as normal.</p>
          <p>The same applies to a challenge whose window has expired: anyone can settle it and keeps ${(CLERK_FEE*100).toFixed(1)}% of the deposit. That fee comes out of the share that would have been burned, so it never touches what either party is owed.</p>
          <p>This matters more than it looks. It means rounds keep settling and seats keep changing hands even if our servers are down, and liveness never depends on the team running a keeper.</p>
          <ul>
            <li><b>Active means one launch since the previous round closed.</b> Not a rolling day — the round itself is the window. One free launch inside a ${ROUND_HOURS}-hour round is always enough.</li>
            <li><b>Miss a round and you are simply not in it.</b> No penalty beyond that; your credited balance stays untouched.</li>
            <li><b>An empty round rolls over.</b> If nobody qualifies, the whole pool moves into the next round rather than sitting idle.</li>
            <li><b>Rounding dust is carried, not stuck.</b> Whatever integer division leaves behind joins the next pool.</li>
            <li><b>Credits belong to the owner recorded in the snapshot.</b> Selling the NFT does not hand your unclaimed rewards to the buyer.</li>
          </ul>

          <p>Three consequences worth being explicit about. <b>Rewards are tied to trading volume</b> — a quiet week pays less at every rank, and zero volume pays zero to everyone including Generals. Rank multiplies your slice but does not add to the pool. And the pool is never funded by minting new WAR, because that would just move value from holders to players and call it a reward.</p></section>

        <section id="network"><h2>Network and wallets</h2>
          <p>Warroom runs on <b>${CHAIN.name}</b>, chain ID ${CHAIN.id}. Supported wallets at launch are MetaMask and WalletConnect.</p>
          <p>The front end detects your network automatically. If you are connected somewhere else you will see a <b>Switch to ${CHAIN.name}</b> prompt, and approving it in your wallet moves you across.</p>
          <p>We never ask for your seed phrase, never hold your private keys, and cannot move anything out of your wallet without a transaction you signed yourself. Anyone asking you for a seed phrase in the name of Warroom is stealing from you.</p>
          <p>These actions are always on-chain: minting, every WAR spend, every burn, missile upgrades, promotions, challenges and reward claims.</p></section>

        <section id="contracts"><h2>Contracts</h2>
          <p>Addresses are published here and on the landing page as soon as each contract is deployed and verified. Until then the slots below read as undeployed, and any address circulating elsewhere is not ours.</p>
          ${contractsBlock()}</section>

            <li><b>Weight follows what you hold.</b> A wallet with ten Commanders takes ten shares of the same pool, which dilutes everyone holding one. The counterweight is work: every one of those ten needs its own launch every round.</li>
            <li><b>Transfers wipe progression.</b> Selling your Commander hands over an empty badge — your rank, hits and any seat you hold do not travel with it.</li>

function syncMintQty(maxQty,first){
  const n=document.getElementById('q-n'); if(!n) return false;
  const cost=mintQty*100000, due=(first?mintQty-1:mintQty)*100000;
  const canAfford=S.wallet_war>=due;
  n.textContent=mintQty;
  document.getElementById('q-lbl').textContent = mintQty>1?'separate characters':'commander';
  document.getElementById('q-mul').textContent = `${mintQty} × 100,000`;
  document.getElementById('q-cost').textContent = `${fmt(cost)} WAR`;
  document.getElementById('q-burn').textContent = `${fmt(cost*0.5)} WAR — 50%`;
  document.getElementById('q-rest').textContent = `${fmt(cost*0.5)} WAR`;
  const go=document.getElementById('q-go');
  go.textContent = !canAfford ? `Not enough WAR — need ${fmt(due)}`
    : mintQty===1 ? 'Mint 1 Commander — 100,000 WAR'
    : `Mint ${mintQty} Commanders — ${fmt(cost)} WAR`;
  go.disabled = !canAfford;
  go.classList.toggle('btn-amber', canAfford);
  document.getElementById('q-hint').textContent = mintQty>1
    ? 'One transaction. Each token needs its own launch every round to earn.'
    : 'One transaction. Play opens straight after it confirms.';
  document.querySelector('.qty [data-v="-"]').disabled = mintQty<=1;
  document.querySelector('.qty [data-v="+"]').disabled = mintQty>=maxQty;
  document.querySelectorAll('.presets button').forEach(b=>{
    const v=b.dataset.v;
    b.classList.toggle('on', v!=='max' && +v===mintQty);
  });
  return true;
}
function drawModal(){
  const L=el('layers');
  if(!modal){ L.innerHTML=''; L.dataset.kind=''; return; }
  const box = L.querySelector('.modal');
  if(box && L.dataset.kind===modal){ box.innerHTML = MODALS[modal](); return; }
  L.innerHTML=`<div class="modal-l" data-act="backdrop"><div class="modal">${MODALS[modal]()}</div></div>`;
  L.dataset.kind = modal;
}
